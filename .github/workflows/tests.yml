name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate unified Advait project atlas
        run: python scripts/validate_project_atlas.py
      - run: python test_harness.py
      - run: python -m unittest -v test_advait_engine.py
      - run: python -m unittest -v tests.test_advait_live_self_run
      - run: python -m unittest -v test_b2b_reconcile.py
      - run: python -m unittest -v test_ceo_control_board.py
      - run: python -m unittest -v test_smv.py
      - run: python -m unittest -v tests.test_advait_sovereign_server
      - run: python -m unittest -v tests.test_relationship_intelligence
      - run: python -m unittest -v tests.test_open_source_intelligence
      - run: python -m unittest -v tests.test_advait_self_crafting
      - name: SCEE live smoke test
        run: python scripts/scee_live_smoke.py
      - name: Live HTTP smoke test
        run: python scripts/live_server_smoke.py
      - name: Phone runtime SQLite lifecycle regression
        run: python -m unittest -v tests.test_phone_runtime_check_connection_lifecycle
      - name: Phone-compatible runtime check
        run: python phone_runtime_check.py
      - name: SQLite ledger soak smoke test
        run: python soak_test.py --hours 0.001 --interval-seconds 0.1 --max-iterations 3 --db /tmp/advait-ci-soak.db
      - name: Advait actual self-run
        run: python advait_engine.py
